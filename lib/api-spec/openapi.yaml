openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Closer — sales command center API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: products
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: goals
  - name: platforms
  - name: resources
  - name: activities
  - name: reflections
  - name: analyses
  - name: vision
  - name: summary
  - name: ai
  - name: Auth
    description: Browser authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Session cookie set. `sid` is included for native clients that cannot read Set-Cookie headers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: Clear the session cookie
      responses:
        '200':
          description: Logged out.
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerAccount
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and session set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserEnvelope' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Email sent (always succeeds to prevent enumeration).
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Consume a reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password updated.
        '400':
          description: Invalid or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/profile:
    patch:
      tags: [Auth]
      operationId: updateProfile
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserEnvelope' }
        '400':
          description: Validation error or email already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed.
        '401':
          description: Wrong current password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /products/{id}/analyze:
    post:
      operationId: analyzeProductWebsite
      tags: [products]
      summary: Scrape and AI-analyze a product's website, updating all intelligence fields
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated product with AI intelligence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAnalyzeResponse" }

  /products/{id}/documents:
    get:
      operationId: listProductDocuments
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductDocument" }
        "401": { description: Authentication required }
        "403": { description: Product access denied }
    post:
      operationId: createProductDocument
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductDocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDocument" }
        "401": { description: Authentication required }
        "403": { description: Product access denied }
  /products/{productId}/documents/{docId}:
    delete:
      operationId: deleteProductDocument
      tags: [products]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
        - { name: docId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "401": { description: Authentication required }
        "403": { description: Product access denied }

  /pipeline:
    get:
      operationId: listPipelineDeals
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Pipeline deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineDeal" }
    post:
      operationId: createPipelineDeal
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDealInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineDeal" }
  /pipeline/reviews-due:
    get:
      operationId: listDueReviews
      tags: [products]
      summary: Pipeline deals with reviews due today or overdue
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Due reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DueReview" }

  /pipeline/{id}:
    patch:
      operationId: updatePipelineDeal
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDealUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineDeal" }
    delete:
      operationId: deletePipelineDeal
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /sales-targets:
    get:
      operationId: listSalesTargets
      tags: [products]
      parameters:
        - { name: productId, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Sales targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalesTarget" }
    post:
      operationId: upsertSalesTarget
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesTargetInput" }
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesTarget" }
  /sales-targets/{id}:
    patch:
      operationId: updateSalesTarget
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesTargetUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesTarget" }
    delete:
      operationId: deleteSalesTarget
      tags: [products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /sales-targets/export:
    get:
      operationId: exportSalesTargets
      tags: [products]
      summary: Download targets as Excel
      parameters:
        - { name: productId, in: query, required: true, schema: { type: integer } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /sales-targets/email:
    post:
      operationId: emailSalesTargets
      tags: [products]
      summary: Email targets as Excel attachment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesTargetsEmailRequest" }
      responses:
        "200":
          description: Sent

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrlResponse' }
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      parameters:
        - { name: filePath, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Object content
          content:
            '*/*':
              schema: { type: string, format: binary }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      parameters:
        - { name: objectPath, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Object content
          content:
            '*/*':
              schema: { type: string, format: binary }

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
    post:
      operationId: createTeamMember
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
    delete:
      operationId: deleteTeamMember
      tags: [team]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /goals/generate:
    post:
      operationId: aiSuggestGoals
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalGenerateRequest" }
      responses:
        "200":
          description: AI-generated goal suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalGenerateResponse" }

  /goals/bulk:
    post:
      operationId: saveGeneratedGoals
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalBulkRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Goal" } }

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      parameters:
        - { name: productId, in: query, required: false, schema: { type: integer } }
        - { name: kind, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
    post:
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    delete:
      operationId: deleteGoal
      tags: [goals]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /platform-states:
    get:
      operationId: listPlatformStates
      tags: [platforms]
      parameters:
        - { name: productId, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Platform states
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformState" }
    post:
      operationId: createPlatformState
      tags: [platforms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformStateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
  /platform-states/{id}:
    patch:
      operationId: updatePlatformState
      tags: [platforms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformStateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformState" }
    delete:
      operationId: deletePlatformState
      tags: [platforms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
    post:
      operationId: createResource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
  /resources/{id}:
    patch:
      operationId: updateResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
    delete:
      operationId: deleteResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string } }
        - { name: beforeDate, in: query, required: false, schema: { type: string }, description: Return activities dated strictly before this YYYY-MM-DD }
        - { name: productId, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
    post:
      operationId: createActivity
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
  /activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
    delete:
      operationId: deleteActivity
      tags: [activities]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /reflections:
    get:
      operationId: listReflections
      tags: [reflections]
      responses:
        "200":
          description: Reflections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reflection" }
    post:
      operationId: createReflection
      tags: [reflections]
      description: Submit end-of-day reflection. Server runs the AI coach review and returns it on the created row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReflectionInput" }
      responses:
        "201":
          description: Created with coach feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reflection" }

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      parameters:
        - { name: productId, in: query, required: false, schema: { type: integer } }
        - { name: kind, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Cached AI analyses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAnalysis" }

  /products/{id}/strategist:
    post:
      operationId: runStrategist
      tags: [ai]
      description: Run the AI marketing strategist for a product for one analysis kind and cache the result.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategistRun" }
      responses:
        "201":
          description: Fresh cached analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalysis" }

  /products/{id}/strategy-document:
    post:
      operationId: createProductStrategyDocument
      tags: [ai, products]
      summary: Combine all completed Strategist analyses into a saved product strategy document
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Saved strategy document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDocument" }
        "400":
          description: One or more required Strategist analyses are missing
        "401":
          description: Authentication required
        "403":
          description: Product access denied
        "404":
          description: Product not found

  /activities/generate:
    post:
      operationId: generateActivities
      tags: [ai]
      description: Generate today's ranked activity list from cached strategist output + platform stages, enforcing the 90/10 rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityGeneration" }
      responses:
        "201":
          description: Generated activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }

  /tool-advisor:
    post:
      operationId: runToolAdvisor
      tags: [ai]
      description: AI suggests new tools/automations; suggestions are inserted as resources with status=considering.
      responses:
        "201":
          description: Suggested resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resource" }

  /vision-items:
    get:
      operationId: listVisionItems
      tags: [vision]
      responses:
        "200":
          description: Vision items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VisionItem" }
    post:
      operationId: createVisionItem
      tags: [vision]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisionItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisionItem" }
  /vision-items/{id}:
    patch:
      operationId: updateVisionItem
      tags: [vision]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisionItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisionItem" }
    delete:
      operationId: deleteVisionItem
      tags: [vision]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /summary/today:
    get:
      operationId: getTodaySummary
      tags: [summary]
      description: Command-center summary — Focus Guard split, coach push, counts, pace alerts.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Today summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodaySummary" }

  /summary/number:
    get:
      operationId: getNumberSummary
      tags: [summary]
      description: The single "Number" view — total revenue target vs current across all products.
      responses:
        "200":
          description: Number summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NumberSummary" }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
