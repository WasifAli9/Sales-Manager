kind = "web"
previewPath = "/"
title = "Closer"
description = "A single-operator sales command center PWA that enforces a 90/10 selling rule. Every morning it hands the founder a ranked list of selling activities per product per platform, tracks focus drift with a Focus Guard, runs an AI marketing strategist per product, and closes each day with a tough-love AI coach review."
version = "1.0.0"
id = "artifacts/closer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22016

[services.development]
run = "pnpm --filter @workspace/closer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/closer", "run", "build" ]
serve = "static"
publicDir = "artifacts/closer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22016"
BASE_PATH = "/"
