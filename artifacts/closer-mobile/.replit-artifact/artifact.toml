kind = "mobile"
previewPath = "/closer-mobile/"
title = "Closer Mobile"
description = "Native mobile companion for Closer — a sales command center app. Shows today's activities and pipeline reviews due, lets you browse products and their pipelines, and surfaces push notifications for review deadlines. Dark navy + teal brand. Connects to the shared Closer API server."
version = "1.0.0"
id = "artifacts/closer-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/closer-mobile/" ]
localPort = 24904

[services.development]
run = "pnpm --filter @workspace/closer-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/closer-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/closer-mobile", "run", "serve" ]

[services.env]
PORT = "24904"
BASE_PATH = "/closer-mobile/"
